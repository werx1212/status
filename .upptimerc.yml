# Настройки Upptime для внешней страницы статуса status.ogurexxx.ru (см. docs/status/README.md).
# Этот файл копируется целиком в репозиторий werx1212/status под именем .upptimerc.yml.
# Проверяется только главная: адреса панели управления на публичной странице быть не должно.
owner: werx1212
repo: status

sites:
  - name: ogurexxx.ru
    url: https://ogurexxx.ru
    expectedStatusCodes:
      - 200

status-website:
  cname: status.ogurexxx.ru
  name: ogurexxx
  # название в шапке — как логотип сайта: текст с мигающим курсором, без картинки
  logoUrl: https://ogurexxx.ru/themes/pro/favicon.svg
  hideNavLogo: true
  favicon: https://ogurexxx.ru/themes/pro/favicon.svg
  theme: dark
  # оформление сайта: цвета, шрифты Geist, строка терминала над заголовком (см. docs/status/README.md)
  customHeadHtml: >-
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
  css: >-
    :root { --body-background-color: #09090b; --body-text-color: rgba(244, 242, 248, .78); --card-background-color: #111015;
    --card-border-color: rgba(244, 242, 248, .11); --nav-background-color: #09090b; --nav-border-bottom-color: rgba(244, 242, 248, .11);
    --nav-current-border-bottom-color: #a78bfa; --up-border-left-color: #4ade80; --down-border-left-color: #f87171;
    --down-background-color: rgba(248, 113, 113, .08); --degraded-border-left-color: #fbbf24; --tag-color: #09090b;
    --tag-up-background-color: #4ade80; --tag-down-background-color: #f87171; --tag-degraded-background-color: #fbbf24;
    --change-background-color: #a78bfa; --submit-button-background-color: #7c3aed; --submit-button-border-color: #7c3aed;
    --error-button-background-color: #7c3aed; --error-button-border-color: #7c3aed; --graph-opacity: .9; }
    html, body { background: #09090b; }
    body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; }
    ::selection { background: #a78bfa; color: #09090b; }
    a { color: #a78bfa; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .container { max-width: 880px; }
    nav { border-bottom-color: rgba(244, 242, 248, .11); }
    nav { padding: 0 !important; margin-bottom: 0 !important; }
    nav .container { max-width: 880px; padding: 0 2rem; }
    nav a { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13.5px; color: rgba(244, 242, 248, .5); padding: 1.6rem 1rem !important; }
    nav a:hover { color: #f4f2f8; }
    nav li:last-child a { padding-right: 0 !important; }
    nav a.logo { color: #f4f2f8; font-family: 'Geist', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: -.04em; line-height: 1; padding: 1.6rem 0 !important; margin-right: 1rem !important; text-decoration: none; }
    nav a.logo div::after { content: ""; display: inline-block; width: .45em; height: .95em; margin-left: 3px; vertical-align: -.12em; background: #a78bfa; animation: ogx-blink 1.1s steps(1) infinite; }
    @keyframes ogx-blink { 50% { opacity: 0; } }
    main header { margin: 3.5rem 0 2.5rem; }
    main header::before { content: "ogurexxx@root:~$ curl -sI https://ogurexxx.ru"; display: block; margin-bottom: 18px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; color: #a78bfa; white-space: pre-wrap; }
    h1 { font-size: clamp(36px, 7vw, 64px); font-weight: 500; line-height: 1; letter-spacing: -.055em; color: #f4f2f8; }
    .lead { max-width: 60ch; margin-top: 20px; font-size: 18px; color: rgba(244, 242, 248, .78); }
    h2, h3 { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; font-size: 15px; letter-spacing: 0; color: #f4f2f8; opacity: 1; }
    h2::before, h3::before { content: "# "; color: #a78bfa; }
    section + h2, .f.changed { margin-top: 3rem; }
    article { border-radius: 10px; padding: 1.1rem 1.3rem; border-color: rgba(244, 242, 248, .11); }
    article + article { margin-top: .6rem; }
    article.up, article.down, article.degraded { border-left-width: 3px; }
    article.graph { background-image: none !important; isolation: isolate; overflow: hidden; }
    article.graph::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--background) center right / contain no-repeat; filter: hue-rotate(95deg) saturate(1.4); opacity: .55; }
    article h4 { font-weight: 500; color: #f4f2f8; }
    article a { color: #f4f2f8; text-decoration: none; }
    .tag { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; border-radius: 999px; padding: .2rem .6rem; }
    form.r label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: rgba(244, 242, 248, .5); border-radius: 999px; }
    form.r input:checked + label { color: #f4f2f8; background: rgba(139, 92, 246, .14); }
    form.r input:focus-visible + label, a:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
    footer, footer a { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; color: rgba(244, 242, 248, .5); }
    @media (prefers-reduced-motion: reduce) { nav a.logo div::after { animation: none; } }
    @media (max-width: 560px) { nav .container { padding: 0 1rem; } nav a { font-size: 12.5px; padding: 1.3rem .5rem !important; } nav a.logo { font-size: 18px; padding: 1.3rem 0 !important; } .container { padding: 0 1rem; } main header { margin-top: 2rem; } }
  introTitle: "Работает ли ogurexxx.ru"
  introMessage: "Эта страница живёт отдельно от сайта и проверяет его снаружи каждые 5 минут, поэтому открывается, даже когда сам сайт недоступен. Разборы сбоев — на [ogurexxx.ru/incidents](https://ogurexxx.ru/incidents)."
  navbar:
    - title: Сайт
      href: https://ogurexxx.ru
    - title: Разборы сбоев
      href: https://ogurexxx.ru/incidents

