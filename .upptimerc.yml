# Настройки Upptime для внешней страницы статуса status.ogurexxx.ru (см. docs/status/README.md).
# Этот файл копируется целиком в репозиторий werx1212/status под именем .upptimerc.yml.
# Проверяется только главная: адреса панели управления на публичной странице быть не должно.
owner: werx1212
repo: status

sites:
  - name: ogurexxx.ru
    url: https://ogurexxx.ru
    expectedStatusCodes:
      - 200

status-website:
  cname: status.ogurexxx.ru
  name: ogurexxx.ru — статус
  introTitle: "Работает ли ogurexxx.ru"
  introMessage: "Эта страница живёт отдельно от сайта и проверяет его снаружи каждые 5 минут, поэтому открывается, даже когда сам сайт недоступен. Разборы сбоев — на [ogurexxx.ru/incidents](https://ogurexxx.ru/incidents)."
  navbar:
    - title: Сайт
      href: https://ogurexxx.ru
    - title: Разборы сбоев
      href: https://ogurexxx.ru/incidents

i18n:
  activeIncidents: Текущие сбои
  allSystemsOperational: Всё работает
  incidentReport: "Сбой #$NUMBER →"
  activeIncidentSummary: "Открыт $DATE, сообщений: $POSTS"
  incidentTitle: "Сбой $NUMBER: подробности"
  incidentDetails: Подробности
  incidentFixed: Исправлено
  incidentOngoing: Продолжается
  incidentOpenedAt: Начало
  incidentClosedAt: Конец
  incidentViewOnGitHub: Открыть на GitHub
  incidentCommentSummary: "$AUTHOR, $DATE"
  incidentBack: "← Ко всем сбоям"
  pastIncidents: Прошлые сбои
  pastIncidentsResolved: "Закрыт за $MINUTES мин, сообщений: $POSTS"
  liveStatus: Сейчас
  overallUptime: "Доступность: $UPTIME"
  overallUptimeTitle: Доступность
  averageResponseTime: "Средний ответ: $TIMEms"
  averageResponseTimeTitle: Время ответа
  sevelDayResponseTime: Время ответа за 7 дней
  responseTimeMs: Время ответа (мс)
  up: Работает
  down: Недоступен
  degraded: Медленно
  ms: мс
  loading: Загрузка
  navGitHub: GitHub
  footer: "Страница статуса — [Upptime](https://upptime.js.org)"
